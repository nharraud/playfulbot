
projects:
  backend:
    overwrite: true
    schema: "../backend/src/infrastructure/graphql/graphqlSchema.graphql"
    documents: "src/hooksAndQueries/backend/graphql/**/*.graphql"
    extensions:
        codegen:
          generates:
            src/types/backend/graphql-generated.ts:
              plugins:
                - "typescript"
                - "typescript-operations"
                - "typescript-react-apollo"
