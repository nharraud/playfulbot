query authenticatedUserTournaments {
  authenticatedUser {
    id,
    username,
    teams {
      id,
      name,
      tournament {
        id,
        name,
        # lastRoundDate,
        status,
      }
    }
    tournamentInvitations {
      tournament {
        id,
        name,
        # lastRoundDate,
        status,
      }
    }
    organizedTournaments {
      id,
      name,
      # lastRoundDate,
      status,
    }
  }
}