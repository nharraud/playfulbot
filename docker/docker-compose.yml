services:
  db:
    image: postgres:17
    ports:
      - "5432"
    environment:
      TZ: 'GMT'
      PGTZ: 'GMT'
  playfulbot-backend:
    build:
      context: ..
      dockerfile: ./docker/backend/Dockerfile
    links:
      - "db:database"
    environment:
      DATABASE_HOST: 'database'
      DATABASE_PORT: '5432'
    ports:
      - "5000:5000"
      - "4000"
  playfulbot-frontend:
    build:
      context: ..
      dockerfile: ./docker/frontend/Dockerfile
    links:
      - "playfulbot-backend:backend"
    ports:
      - "443:443"
      - "80:80"
