# GraphQL API between backend and React.js Frontend

scalar Date
scalar JSON

#
# Generic Error types
#
interface Error {
  message: String!
}

type ForbiddenError implements Error {
  message: String!
}

type ValidationError implements Error {
  message: String!
}

#
# Main types
#
type User {
  id: ID!
  username: String!
  teams: [Team]
  tournamentInvitations: [TournamentInvitation!]
  organizedTournaments: [Tournament!]
}

enum TournamentStatus {
  CREATED, STARTED, ENDED
}

enum TournamentRole {
  ORGANIZER
}

type Tournament {
  id: ID!
  name: String!
  status: TournamentStatus
  startDate: Date
  endDate: Date
  teams: [Team]

  # rounds(maxSize: Int = 5, before: Date, after: Date): [Round]

  myRole: TournamentRole

  # invitationLinkID: ID
}

type TournamentInvitation {
  tournament: Tournament!
  invitee: User!
  sentAt: Date!
}

type Team {
  id: ID!
  name: String!
  members: [User]
  arenas: [Arena]
  tournament: Tournament!
}

type UserNotPartOfAnyTeam {
  message: String!
}

union UserTeamResult = Team | UserNotPartOfAnyTeam

type LoginSuccess {
  user: User!
  token: String!
}

type InvalidCredentialsError implements Error {
  message: String!
}

type LoginFailure {
  errors: [LoginError!]!
}

union LoginError = InvalidCredentialsError

union LoginResult = LoginSuccess | LoginFailure


type UsernameAlreadyTaken implements Error {
  message: String!
}

union UserRegistrationResult = LoginSuccess | ValidationError | UsernameAlreadyTaken



type DeletedTeam {
  id: ID!
  name: String!
}

union TeamOrDeletedTeam = Team | DeletedTeam

type JoinTeamSuccess {
  oldTeam: TeamOrDeletedTeam
  newTeam: Team
}

type JoinTeamFailure {
  errors: [JoinTeamError!]!
}

type TeamNotFoundError implements Error {
  message: String!
  teamID: ID
}

union JoinTeamError = TeamNotFoundError | ForbiddenError

union JoinTeamResult = JoinTeamSuccess | JoinTeamFailure


