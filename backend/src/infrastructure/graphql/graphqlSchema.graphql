type Subscription {
  arenaGames(arenaID: ID!): ArenaGamesResult
  # playerGames(playerID: ID!): LivePlayerGames
#   teamPlayer(teamID: ID!): LivePlayer
}

type Query {
  tournament(tournamentID: ID!): Tournament
  arena(arenaID: ID!): ArenaResult
  # tournamentByInvitationLink(tournamentInvitationLinkID: ID!): Tournament
  # round(roundID: ID): Round
  team(userID: ID!, tournamentID: ID!): UserTeamResult
  authenticatedUser: User
}

type Mutation {
  createArenaGame(arenaID: ID!): CreateArenaGameResult
  createArena(teamID: ID!, name: String!): CreateArenaResult
  deleteArena(arenaID: ID!): DeleteArenaResult

  registerUser(username: String!, password: String!): UserRegistrationResult
  login(username: String!, password: String!): LoginResult
  logout: Boolean

  createTournament(
    name: String!,
    startDate: Date!,
    endDate: Date!
  ): Tournament

  updateTournamentConfiguration(tournamentID: ID!, input: TournamentConfigurationInput!): UpdateTournamentConfigurationResult

#   registerTournamentInvitationLink(tournamentInvitationLinkID: ID!): RegisterTournamentInvitationResult

  createTeam(tournamentID: ID!, input: TeamInput!, join: Boolean! = true): CreateTeamResult
  updateTeam(teamID: ID!, input: TeamInput!): UpdateTeamResult
  joinTeam(teamID: ID!): JoinTeamResult
}
