# #
# # Update Team Input/Output
# #

input TeamInput {
  name: String
}

type UpdateTeamSuccess {
  team: Team
}

type UpdateTeamFailure {
  errors: [UpdateTeamError!]!
}

union UpdateTeamError = ForbiddenError | ValidationError | TeamNameAlreadyTakenError

union UpdateTeamResult = UpdateTeamSuccess | UpdateTeamFailure


# #
# # Update Tournament Configuration Input/Output
# #

input TournamentConfigurationInput {
  name: String!
  startDate: Date!
  endDate: Date!
}

type UpdateTournamentConfigurationSuccess {
  tournament: Tournament
}

type UpdateTournamentConfigurationFailure {
  errors: [UpdateTournamentConfigurationError!]!
}

union UpdateTournamentConfigurationError = ForbiddenError | ValidationError

union UpdateTournamentConfigurationResult = UpdateTournamentConfigurationSuccess | UpdateTournamentConfigurationFailure


# #
# # Create Team Input/Output
# #
type CreateTeamSuccess {
  team: Team
}

type CreateTeamFailure {
  errors: [CreateTeamError!]!
}

type TeamNameAlreadyTakenError implements Error {
  message: String!
}

union CreateTeamError = ForbiddenError | ValidationError | TeamNameAlreadyTakenError

union CreateTeamResult = CreateTeamSuccess | CreateTeamFailure


# #
# # Create Arena Input/Output
# #
type CreateArenaSuccess {
  arena: Arena!
}

type CreateArenaFailure {
  errors: [CreateArenaError!]!
}

type ArenaNameAlreadyTakenError implements Error {
  message: String!
}

type MaxArenaReachedError implements Error {
  message: String!
}

union CreateArenaError = ForbiddenError | ArenaNameAlreadyTakenError | MaxArenaReachedError | ValidationError

union CreateArenaResult = CreateArenaSuccess | CreateArenaFailure


# #
# # Get Arena Input/Output
# #
type ArenaSuccess {
  arena: Arena
}

type ArenaFailure {
  errors: [ArenaError!]!
}

type ArenaNotFoundError implements Error {
  message: String!
  arenaID: ID
}

union ArenaError = ForbiddenError | ArenaNotFoundError

union ArenaResult = ArenaSuccess | ArenaFailure


# #
# # Delete Arena Input/Output
# #
type DeleteArenaSuccess {
  arenaID: ID!
}

type DeleteArenaFailure {
  errors: [DeleteArenaError!]!
}

union DeleteArenaError = ForbiddenError | ArenaNotFoundError

union DeleteArenaResult = DeleteArenaSuccess | DeleteArenaFailure


# #
# # Create Arena Game Input/Output
# #
type CreateArenaGameSuccess {
  gameID: String!
}

type CreateArenaGameFailure {
  errors: [CreateArenaGameError!]!
}

union CreateArenaGameError = ForbiddenError | ArenaNotFoundError

union CreateArenaGameResult = CreateArenaGameSuccess | CreateArenaGameFailure

# #
# # Stream Arena Game Input/Output
# #
type GameRef {
  gameID: String!
  graphqlUrl: String!
}

type ArenaGamesFailure {
  errors: [ArenaGamesError!]!
}
# type NoGame {
#   reason: String!
# }

union ArenaGamesError = ForbiddenError | ArenaNotFoundError

union ArenaGamesResult = GameRef | ArenaGamesFailure


