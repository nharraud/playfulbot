# GraphQL API between backend and React.js Frontend

scalar Date
scalar JSON

#
# Generic Error types
#
interface Error {
  message: String!
}

type ForbiddenError implements Error {
  message: String!
}

type ValidationError implements Error {
  message: String!
}

#
# Main types
#
type User {
  id: ID!
  username: String!
  # teams: [Team]
  # tournamentInvitations: [TournamentInvitation!]
  # organizedTournaments: [Tournament!]
}

enum TournamentStatus {
  CREATED, STARTED, ENDED
}

# enum TournamentRoleName {
#   ADMIN
# }

type Tournament {
  id: ID!
  name: String!
  status: TournamentStatus
  # startDate: Date
  # lastRoundDate: Date
  # firstRoundDate: Date
  # roundsNumber: Int
  # minutesBetweenRounds: Int
  # teams: [Team]

  # rounds(maxSize: Int = 5, before: Date, after: Date): [Round]

  # myRole: TournamentRoleName

  # invitationLinkID: ID
}

# type TournamentInvitation {
#   id: ID
#   tournament: Tournament
#   invitee: User
# }

type Team {
  id: ID!
  name: String!
  members: [User]
  tournament: Tournament
}

type UserNotPartOfAnyTeam {
  message: String!
}

union UserTeamResult = Team | UserNotPartOfAnyTeam

type LoginResult {
  user: User!
  token: String!
}

type UsernameAlreadyTaken implements Error {
  message: String!
}

union UserRegistrationResult = LoginResult | ValidationError | UsernameAlreadyTaken



type DeletedTeam {
  id: ID!
  name: String!
}

union TeamOrDeletedTeam = Team | DeletedTeam

type JoinTeamSuccess {
  oldTeam: TeamOrDeletedTeam
  newTeam: Team
}

type JoinTeamFailure {
  errors: [JoinTeamError!]!
}

type TeamNotFoundError implements Error {
  message: String!
  teamID: ID
}

union JoinTeamError = TeamNotFoundError | ForbiddenError

union JoinTeamResult = JoinTeamSuccess | JoinTeamFailure


